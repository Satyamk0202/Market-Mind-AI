<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MarketMIND — AI Stock Research</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>


<header class="topbar">
  <div class="logo-zone">
    <div class="logo">Market<span>MIND</span></div>
    <div class="logo-sub">AI · NSE · BSE · ₹ INR</div>
  </div>
  <nav class="nav-pills" id="navPills">
    <button class="npill active" onclick="goTo('dashboard',this)">Dashboard</button>
    <button class="npill" onclick="goTo('research',this)">Research</button>
    <button class="npill" onclick="goTo('screener',this)">Screener</button>
    <button class="npill" onclick="goTo('news',this)">News</button>
  </nav>
  <div class="topbar-right">
    <div class="mkt-pill">
      <span class="mkt-dot" id="mktDot"></span>
      <span id="mktLbl">NSE</span>
    </div>
    <span class="clock" id="clkEl"></span>
    <button onclick="logout()" style="margin-left:15px;">Logout</button>
  </div>
</header>


<div class="ticker-bar">
  <div class="ticker-inner" id="tickerEl">
    <span class="ticker-placeholder">Connecting to MarketMIND API…</span>
  </div>
</div>


<div class="layout">


  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-label">Navigate</div>
      <div class="sb-nav">
        <button class="sb-btn active" onclick="goTo('dashboard',null)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
        <button class="sb-btn" onclick="goTo('research',null)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Research
        </button>
        <button class="sb-btn" onclick="goTo('screener',null)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Screener
        </button>
        <button class="sb-btn" onclick="goTo('news',null)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"/><path d="M2 10h6v12H2z"/></svg>
          News
        </button>
        <button class="sb-btn" onclick="goTo('portfolio',null)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Portfolio
        </button>
      </div>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-section sb-wl-section">
      <div class="sb-label">Watchlist</div>
      <div id="sbWl"><div class="ld"><div class="spin"></div></div></div>
    </div>
    <div class="sb-footer">
      <div class="api-status" id="apiStatus">
        <span class="api-dot" id="apiDot"></span>
        <span id="apiTxt">Checking API…</span>
      </div>
    </div>
  </aside>


  <main class="main" id="mainArea"></main>

</div>
<script>
  if (!localStorage.getItem("loggedIn")) {
    window.location.href = "auth.html";

  }
</script>
<script src="js/api.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
<script>
function logout() {
  localStorage.removeItem("loggedIn");
  window.location.href = "auth.html";
}
</script>
</body>
</html>
